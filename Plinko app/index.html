<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plinko Pro - Symmetric Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; touch-action: manipulation; }
        #game-container { position: relative; border: 2px solid #1e293b; border-radius: 24px; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        canvas { display: block; max-width: 100%; height: auto; }
        .ui-panel { margin-bottom: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px 25px; border-radius: 50px; border: 1px solid #334155; backdrop-filter: blur(10px); display: flex; gap: 15px; align-items: center; }
        .stats { font-size: 20px; font-weight: 900; color: #10b981; }
        .user-nick { font-size: 14px; color: #94a3b8; cursor: pointer; text-decoration: underline; }
        .controls { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 600px; }
        .sliders { display: flex; gap: 10px; width: 90%; }
        .slider-group { background: #1e293b; padding: 8px; border-radius: 16px; flex: 1; text-align: center; border: 1px solid #334155; }
        .slider-group.disabled { opacity: 0.4; pointer-events: none; }
        label { font-size: 10px; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 4px; }
        input[type=range] { width: 90%; cursor: pointer; accent-color: #6366f1; }
        button#dropBtn { background: #6366f1; border: none; color: white; padding: 12px 60px; font-size: 20px; border-radius: 18px; cursor: pointer; font-weight: 900; box-shadow: 0 4px 0 #4338ca; transition: 0.1s; }
        button#dropBtn:active { transform: translateY(2px); box-shadow: 0 0 0 #4338ca; }
        #leaderboard-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 25px; border-radius: 20px; border: 2px solid #6366f1; z-index: 100; min-width: 300px; }
        .leader-item { display: flex; justify-content: space-between; padding: 12px 8px; border-bottom: 1px solid #334155; font-size: 14px; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <div class="user-nick" id="nick-display" onclick="changeNick()">Ustaw Nick</div>
        <div class="stats">$ <span id="score">1000</span></div>
        <button id="show-leaders" style="background:none; border:none; cursor:pointer; font-size: 24px;">🏆</button>
    </div>
    
    <div id="game-container">
        <canvas id="plinkoCanvas" width="800" height="580"></canvas>
    </div>

    <div class="controls">
        <div class="sliders" id="ui-sliders">
            <div class="slider-group">
                <label>Bet: <span id="costVal">10</span></label>
                <input type="range" id="costSlider" min="5" max="500" step="5" value="10">
            </div>
            <div class="slider-group">
                <label>Rows (Odd): <span id="rowsVal">15</span></label>
                <input type="range" id="rowsSlider" min="7" max="15" step="2" value="15">
            </div>
        </div>
        <button id="dropBtn">GRAJ</button>
    </div>

    <div id="leaderboard-modal">
        <h3 style="color: #6366f1; text-align: center;">TOP 5 GRACZY</h3>
        <div id="leader-list">Pobieranie...</div>
        <button class="close-btn" onclick="toggleLeaders()">ZAMKNIJ</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://uwgxdwznochxndodqoqm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3Z3hkd3pub2NoeG5kb2Rxb3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNDAzNzEsImV4cCI6MjA4NTcxNjM3MX0.CZRJziYrNl19oG5fyIzbnBqZBQ9OwQftUB2dkuslo9Q'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const nickDisplay = document.getElementById('nick-display');
        const uiSliders = document.getElementById('ui-sliders');
        
        let score = parseInt(localStorage.getItem('plinko_balance')) || 1000;
        let nick = localStorage.getItem('plinko_nick') || "Anonim";
        let balls = [], pins = [], multipliers = [];
        let spacingX = 42; 
        const ballRadius = 7, pinRadius = 4, gravity = 0.22, bounceForce = 2.0;

        nickDisplay.innerText = nick;
        scoreEl.innerText = score;

        function changeNick() {
            let n = prompt("Twój nick:", nick);
            if(n) { nick = n.substring(0, 12); localStorage.setItem('plinko_nick', nick); nickDisplay.innerText = nick; }
        }

        async function saveScoreToCloud(s) { try { await _supabase.from('leaderboard').insert([{ username: nick, score: s }]); } catch(e) {} }

        async function toggleLeaders() {
            const m = document.getElementById('leaderboard-modal');
            const l = document.getElementById('leader-list');
            if (m.style.display === "block") { m.style.display = "none"; return; }
            m.style.display = "block";
            const { data } = await _supabase.from('leaderboard').select('username, score').order('score', { ascending: false }).limit(20);
            if (data) {
                l.innerHTML = "";
                const seen = new Set(); const top = [];
                for(let p of data) { if(!seen.has(p.username.toLowerCase())) { seen.add(p.username.toLowerCase()); top.push(p); } if(top.length === 5) break; }
                top.forEach((p, i) => { l.innerHTML += `<div class="leader-item"><span>${i+1}. ${p.username}</span><b>$${p.score}</b></div>`; });
            }
        }

        function setupBoard() {
            pins = []; multipliers = [];
            const rCount = parseInt(document.getElementById('rowsSlider').value);
            document.getElementById('rowsVal').innerText = rCount;
            
            // Zmniejszony odstęp pionowy, aby piramida była niższa
            const spacingY = 30; 

            for (let i = 0; i < rCount; i++) {
                const pinsInRow = i + 3;
                for (let j = 0; j < pinsInRow; j++) {
                    pins.push({
                        x: canvas.width / 2 + (j - (pinsInRow - 1) / 2) * spacingX,
                        y: 60 + i * spacingY
                    });
                }
            }

            // SYMERYCZNE MNOŻNIKI
            const base = [110, 41, 10, 5, 2, 1.2, 0.5, 0.2, 0.5, 1.2, 2, 5, 10, 41, 110];
            const slotsCount = rCount + 2; 
            const midBase = 7; // Indeks wartości 0.2 w tablicy 'base'
            const midTarget = (slotsCount - 1) / 2;

            for (let i = 0; i < slotsCount; i++) {
                const offset = i - midTarget;
                // Zaokrąglanie gwarantuje idealne odbicie lustrzane
                const idx = Math.round(midBase + offset);
                multipliers.push(base[idx] || 1.0);
            }
            bottomY = 60 + (rCount - 1) * spacingY + 45;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#475569";
            pins.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, pinRadius, 0, Math.PI*2); ctx.fill(); });

            const sw = spacingX;
            const sx = canvas.width / 2 - (multipliers.length * sw) / 2;

            multipliers.forEach((m, i) => {
                const d = Math.abs(i - (multipliers.length - 1) / 2) / ((multipliers.length - 1) / 2);
                ctx.fillStyle = `rgb(255, ${Math.floor(255*(1-d))}, ${Math.floor(100*(1-d))})`;
                ctx.fillRect(sx + i * sw + 2, bottomY, sw - 4, 30);
                ctx.fillStyle = d > 0.6 ? "white" : "#020617";
                ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(m + "x", sx + i * sw + sw / 2, bottomY + 20);
            });

            balls.forEach((b, idx) => {
                b.vy += gravity; b.x += b.vx; b.y += b.vy;
                pins.forEach(p => {
                    const d = Math.hypot(b.x - p.x, b.y - p.y);
                    if (d < ballRadius + pinRadius) {
                        const a = Math.atan2(b.y - p.y, b.x - p.x);
                        b.vx = Math.cos(a) * bounceForce + (Math.random()-0.5)*0.25;
                        b.vy = Math.sin(a) * bounceForce;
                    }
                });
                ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, ballRadius, 0, Math.PI*2); ctx.fill();
                if (b.y > bottomY) {
                    const s = Math.floor((b.x - sx) / sw);
                    if (s >= 0 && s < multipliers.length) {
                        const w = Math.floor(b.bet * multipliers[s]);
                        score += w; scoreEl.innerText = score;
                        localStorage.setItem('plinko_balance', score);
                        if(w > b.bet) saveScoreToCloud(score);
                    }
                    balls.splice(idx, 1);
                    if(balls.length === 0) uiSliders.classList.remove('disabled');
                }
            });
            requestAnimationFrame(draw);
        }

        document.getElementById('dropBtn').onclick = () => {
            const b = parseInt(document.getElementById('costSlider').value);
            if (score >= b) {
                score -= b; scoreEl.innerText = score;
                uiSliders.classList.add('disabled');
                balls.push({ x: canvas.width / 2 + (Math.random()-0.5)*2, y: 15, vx: 0, vy: 2, bet: b });
            }
        };

        document.getElementById('show-leaders').onclick = toggleLeaders;
        document.getElementById('rowsSlider').oninput = setupBoard;
        document.getElementById('costSlider').oninput = (e) => { document.getElementById('costVal').innerText = e.target.value; };

        setupBoard(); draw();
    </script>
</body>
</html>
