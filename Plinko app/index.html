<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plinko Pro - Adaptive Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; touch-action: manipulation; }
        #game-layout { display: flex; gap: 20px; align-items: flex-start; }
        #game-container { position: relative; border: 2px solid #1e293b; border-radius: 24px; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        canvas { display: block; max-width: 100%; height: auto; }
        
        #history-panel { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; border-radius: 20px; width: 100px; height: 580px; display: flex; flex-direction: column; align-items: center; padding: 10px; overflow: hidden; }
        .history-title { font-size: 10px; color: #94a3b8; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        #history-list { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        .history-item { padding: 6px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 13px; animation: slideIn 0.2s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        .ui-panel { margin-bottom: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px 25px; border-radius: 50px; border: 1px solid #334155; backdrop-filter: blur(10px); display: flex; gap: 15px; align-items: center; }
        .stats { font-size: 24px; font-weight: 900; color: #10b981; }
        .user-nick { font-size: 14px; color: #94a3b8; cursor: pointer; text-decoration: underline; }
        
        .controls { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 600px; }
        .sliders { display: flex; gap: 10px; width: 95%; }
        .slider-group { background: #1e293b; padding: 12px; border-radius: 16px; flex: 1; text-align: center; border: 1px solid #334155; transition: 0.3s; }
        label { font-size: 11px; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 6px; font-weight: bold; }
        input[type=range] { width: 95%; cursor: pointer; accent-color: #6366f1; }
        
        button#dropBtn { 
            background: #6366f1; border: none; color: white; padding: 15px 60px; 
            font-size: 20px; border-radius: 18px; cursor: pointer; font-weight: 900; 
            box-shadow: 0 4px 0 #4338ca; transition: 0.1s; width: 280px;
        }
        button#dropBtn:active { transform: translateY(2px); box-shadow: 0 0 0 #4338ca; }
        button#dropBtn:disabled { background: #334155; box-shadow: none; cursor: not-allowed; opacity: 0.6; }

        #leaderboard-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 25px; border-radius: 20px; border: 2px solid #6366f1; z-index: 100; min-width: 300px; box-shadow: 0 0 100px rgba(0,0,0,0.9); }
        .leader-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #334155; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; margin-top: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <div class="user-nick" id="nick-display" onclick="changeNick()">Ustaw Nick</div>
        <div class="stats">$ <span id="score">1000</span></div>
        <button id="show-leaders" style="background:none; border:none; cursor:pointer; font-size: 24px;">🏆</button>
    </div>
    
    <div id="game-layout">
        <div id="game-container">
            <canvas id="plinkoCanvas" width="700" height="580"></canvas>
        </div>
        
        <div id="history-panel">
            <div class="history-title">Ostatnie 20</div>
            <div id="history-list"></div>
        </div>
    </div>

    <div class="controls">
        <div class="sliders">
            <div class="slider-group" id="bet-group">
                <label>Wartość kulki: <span id="costVal">10</span></label>
                <input type="range" id="costSlider" min="5" max="1000" step="5" value="10">
            </div>
            <div class="slider-group">
                <label>Rzędy (Poziom): <span id="rowsVal">15</span></label>
                <input type="range" id="rowsSlider" min="7" max="15" step="2" value="15">
            </div>
        </div>
        <button id="dropBtn">PUŚĆ KULKĘ</button>
    </div>

    <div id="leaderboard-modal">
        <h3 style="text-align: center; color: #6366f1; margin-top: 0;">TOP 5 GRACZY</h3>
        <div id="leader-list"></div>
        <button class="close-btn" onclick="toggleLeaders()">ZAMKNIJ</button>
    </div>

    <script>
        // --- KONFIGURACJA ---
        const SUPABASE_URL = 'https://uwgxdwznochxndodqoqm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3Z3hkd3pub2NoeG5kb2Rxb3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNDAzNzEsImV4cCI6MjA4NTcxNjM3MX0.CZRJziYrNl19oG5fyIzbnBqZBQ9OwQftUB2dkuslo9Q'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const costSlider = document.getElementById('costSlider');
        const costVal = document.getElementById('costVal');
        const dropBtn = document.getElementById('dropBtn');
        
        let score = parseInt(localStorage.getItem('plinko_balance')) || 1000;
        let nick = localStorage.getItem('plinko_nick') || "Gracz";
        let gameHistory = [];
        let balls = [], pins = [], multipliers = [];
        let lastDropTime = 0;
        const DROP_DELAY = 250; 
        let bottomY = 550;

        const ballRadius = 6, pinRadius = 3, gravity = 0.22, bounceForce = 2.2;
        let spacingX = 36, spacingY = 28;

        document.getElementById('nick-display').innerText = nick;
        updateUI();

        // --- DYNAMIKA ZAKŁADU ---
        function updateUI() {
            scoreEl.innerText = score.toLocaleString();
            
            // Maksymalny zakład to 50% obecnego stanu punktów, ale nie mniej niż 500
            let maxBet = Math.max(500, Math.floor(score * 0.5));
            costSlider.max = maxBet;
            
            // Jeśli aktualny zakład jest większy niż nowe max, zmniejsz go
            if (parseInt(costSlider.value) > maxBet) {
                costSlider.value = maxBet;
                costVal.innerText = maxBet;
            }
        }

        function changeNick() {
            let n = prompt("Wprowadź swój nick (max 12 znaków):", nick);
            if(n) { nick = n.substring(0, 12); localStorage.setItem('plinko_nick', nick); document.getElementById('nick-display').innerText = nick; }
        }

        async function saveScoreToCloud(s) { try { await _supabase.from('leaderboard').insert([{ username: nick, score: s }]); } catch(e) {} }

        async function toggleLeaders() {
            const m = document.getElementById('leaderboard-modal');
            const l = document.getElementById('leader-list');
            if (m.style.display === "block") { m.style.display = "none"; return; }
            m.style.display = "block"; l.innerHTML = "Pobieranie wyników...";
            
            const { data } = await _supabase.from('leaderboard').select('username, score').order('score', { ascending: false }).limit(30);
            if (data) {
                l.innerHTML = "";
                const seen = new Set(); const top = [];
                for(let p of data) { if(!seen.has(p.username.toLowerCase())) { seen.add(p.username.toLowerCase()); top.push(p); } if(top.length === 5) break; }
                top.forEach((p, i) => { l.innerHTML += `<div class="leader-item"><span>${i+1}. ${p.username}</span><b>$${p.score.toLocaleString()}</b></div>`; });
            }
        }

        function updateHistoryUI(m) {
            gameHistory.unshift(m);
            if (gameHistory.length > 20) gameHistory.pop();
            const list = document.getElementById('history-list');
            list.innerHTML = "";
            gameHistory.forEach(val => {
                const item = document.createElement('div');
                item.className = 'history-item';
                if (val >= 10) item.style.background = '#ef4444';
                else if (val >= 2) { item.style.background = '#f59e0b'; item.style.color = '#020617'; }
                else if (val >= 1) item.style.background = '#10b981';
                else { item.style.background = '#334155'; item.style.color = '#94a3b8'; }
                item.innerText = val + "x";
                list.appendChild(item);
            });
        }

        function setupBoard() {
            pins = [];
            const rCount = parseInt(document.getElementById('rowsSlider').value);
            document.getElementById('rowsVal').innerText = rCount;
            
            for (let i = 0; i < rCount; i++) {
                const pinsInRow = i + 3;
                for (let j = 0; j < pinsInRow; j++) {
                    pins.push({ 
                        x: canvas.width / 2 + (j - (pinsInRow - 1) / 2) * spacingX, 
                        y: 60 + i * spacingY 
                    });
                }
            }

            // Mnożniki - wyśrodkowane i symetryczne
            const baseSet = [50, 25, 10, 5, 2, 1.2, 0.5, 0.2];
            const slotsCount = rCount + 1;
            let temp = [];
            for(let i=0; i<slotsCount; i++) {
                let dist = Math.abs(i - (slotsCount-1)/2) / ((slotsCount-1)/2);
                let idx = Math.min(Math.floor(dist * baseSet.length), baseSet.length - 1);
                temp.push(baseSet[idx]);
            }
            multipliers = temp;
            bottomY = 60 + (rCount) * spacingY + 10;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Rysowanie pinów
            ctx.fillStyle = "#475569";
            pins.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, pinRadius, 0, Math.PI*2); ctx.fill(); });

            // Rysowanie kieszeni mnożników
            const sw = spacingX, sx = canvas.width / 2 - (multipliers.length * sw) / 2;
            multipliers.forEach((m, i) => {
                const dist = Math.abs(i - (multipliers.length - 1) / 2) / ((multipliers.length - 1) / 2);
                ctx.fillStyle = `rgb(${100 + 155*dist}, ${50 + 100*(1-dist)}, ${200*(1-dist)})`;
                ctx.roundRect ? ctx.beginPath() : null; // Fallback
                ctx.fillRect(sx + i * sw + 2, bottomY, sw - 4, 30);
                ctx.fillStyle = "white";
                ctx.font = "bold 10px Inter"; ctx.textAlign = "center";
                ctx.fillText(m + "x", sx + i * sw + sw / 2, bottomY + 19);
            });

            // Fizyka kulek
            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.vy += gravity; b.x += b.vx; b.y += b.vy;

                // Kolizje z pinami (z poprawką anti-stuck)
                pins.forEach(p => {
                    const dx = b.x - p.x, dy = b.y - p.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < ballRadius + pinRadius) {
                        const angle = Math.atan2(dy, dx);
                        const overlap = (ballRadius + pinRadius) - dist;
                        b.x += Math.cos(angle) * overlap;
                        b.y += Math.sin(angle) * overlap;
                        b.vx = Math.cos(angle) * bounceForce + (Math.random()-0.5)*0.5;
                        b.vy = Math.sin(angle) * bounceForce;
                    }
                });

                // Rysowanie kulki
                ctx.fillStyle = "#fff";
                ctx.shadowBlur = 10; ctx.shadowColor = "#6366f1";
                ctx.beginPath(); ctx.arc(b.x, b.y, ballRadius, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                // Sprawdzenie wygranej
                if (b.y > bottomY) {
                    const slotIdx = Math.floor((b.x - sx) / sw);
                    if (slotIdx >= 0 && slotIdx < multipliers.length) {
                        const m = multipliers[slotIdx];
                        const winAmount = Math.floor(b.bet * m);
                        score += winAmount;
                        updateUI();
                        localStorage.setItem('plinko_balance', score);
                        updateHistoryUI(m);
                        if (m >= 5) saveScoreToCloud(score);
                    }
                    balls.splice(i, 1);
                }
            }
            requestAnimationFrame(draw);
        }

        dropBtn.onclick = () => {
            const now = Date.now();
            if (now - lastDropTime < DROP_DELAY) return; 
            const bet = parseInt(costSlider.value);
            if (score >= bet) {
                score -= bet;
                updateUI();
                lastDropTime = now;
                balls.push({ x: canvas.width / 2 + (Math.random()-0.5)*4, y: 20, vx: 0, vy: 1, bet: bet });
            }
        };

        costSlider.oninput = (e) => costVal.innerText = parseInt(e.target.value).toLocaleString();
        document.getElementById('rowsSlider').oninput = setupBoard;
        document.getElementById('show-leaders').onclick = toggleLeaders;

        setupBoard(); 
        draw();
    </script>
</body>
</html>
