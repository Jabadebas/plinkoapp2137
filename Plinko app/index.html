<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plinko Pro - High Roller Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; touch-action: manipulation; }
        #game-container { position: relative; border: 2px solid #1e293b; border-radius: 24px; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        canvas { display: block; max-width: 100%; height: auto; }
        .ui-panel { margin-bottom: 10px; background: rgba(15, 23, 42, 0.9); padding: 10px 25px; border-radius: 50px; border: 1px solid #334155; backdrop-filter: blur(10px); display: flex; gap: 15px; align-items: center; }
        .stats { font-size: 20px; font-weight: 900; color: #10b981; }
        .user-nick { font-size: 14px; color: #94a3b8; cursor: pointer; text-decoration: underline; }
        .controls { margin-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 600px; }
        .sliders { display: flex; gap: 10px; width: 90%; }
        .slider-group { background: #1e293b; padding: 8px; border-radius: 16px; flex: 1; text-align: center; border: 1px solid #334155; transition: 0.3s; }
        .slider-group.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(1); }
        label { font-size: 10px; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 4px; }
        input[type=range] { width: 90%; cursor: pointer; accent-color: #6366f1; }
        button#dropBtn { background: #6366f1; border: none; color: white; padding: 12px 60px; font-size: 20px; border-radius: 18px; cursor: pointer; font-weight: 900; box-shadow: 0 4px 0 #4338ca; transition: 0.1s; }
        button#dropBtn:active { transform: translateY(2px); box-shadow: 0 0 0 #4338ca; }
        #leaderboard-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 25px; border-radius: 20px; border: 2px solid #6366f1; z-index: 100; min-width: 300px; box-shadow: 0 0 100px rgba(0,0,0,0.9); }
        .leader-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #334155; font-size: 14px; gap: 10px; }
        .leader-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .leader-item b { color: #10b981; min-width: 80px; text-align: right; }
        .rank-number { color: #6366f1; font-weight: bold; margin-right: 5px; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <div class="user-nick" id="nick-display" onclick="changeNick()">Ustaw Nick</div>
        <div class="stats">$ <span id="score">1000</span></div>
        <button id="show-leaders" style="background:none; border:none; cursor:pointer; font-size: 24px;">🏆</button>
    </div>
    
    <div id="game-container">
        <canvas id="plinkoCanvas" width="800" height="600"></canvas>
    </div>

    <div class="controls">
        <div class="sliders" id="ui-sliders">
            <div class="slider-group">
                <label>Bet: <span id="costVal">10</span></label>
                <input type="range" id="costSlider" min="5" max="500" step="5" value="10">
            </div>
            <div class="slider-group">
                <label>Rows: <span id="rowsVal">16</span></label>
                <input type="range" id="rowsSlider" min="8" max="16" value="16">
            </div>
        </div>
        <button id="dropBtn">GRAJ</button>
    </div>

    <div id="leaderboard-modal">
        <h3 style="margin-top: 0; color: #6366f1; text-align: center;">TOP 5 GRACZY</h3>
        <div id="leader-list">Pobieranie...</div>
        <button class="close-btn" onclick="toggleLeaders()">ZAMKNIJ</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://uwgxdwznochxndodqoqm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3Z3hkd3pub2NoeG5kb2Rxb3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNDAzNzEsImV4cCI6MjA4NTcxNjM3MX0.CZRJziYrNl19oG5fyIzbnBqZBQ9OwQftUB2dkuslo9Q'; // Pamiętaj o wklejeniu klucza!
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const nickDisplay = document.getElementById('nick-display');
        const uiSliders = document.getElementById('ui-sliders');
        const dropBtn = document.getElementById('dropBtn');
        const costSlider = document.getElementById('costSlider');
        const costVal = document.getElementById('costVal');
        
        let score = parseInt(localStorage.getItem('plinko_balance')) || 1000;
        let nick = localStorage.getItem('plinko_nick') || "Anonim";
        let lastClickTime = 0;

        nickDisplay.innerText = nick;
        scoreEl.innerText = score;

        function formatScore(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num;
        }

        function updateSliderLimits() {
            if (score >= 10000) {
                costSlider.max = score;
                let newStep = Math.floor(score / 100);
                costSlider.step = newStep > 10 ? Math.floor(newStep / 10) * 10 : 10;
            } else {
                costSlider.max = 500;
                costSlider.step = 5;
            }
            costVal.innerText = formatScore(costSlider.value);
        }

        function changeNick() {
            let newNick = prompt("Twój nick:", nick);
            if(newNick && newNick.trim() !== "") {
                nick = newNick.substring(0, 12);
                localStorage.setItem('plinko_nick', nick);
                nickDisplay.innerText = nick;
            }
        }

        async function saveScoreToCloud(finalScore) {
            try { await _supabase.from('leaderboard').insert([{ username: nick, score: finalScore }]); } catch(e) {}
        }

        async function toggleLeaders() {
            const modal = document.getElementById('leaderboard-modal');
            const list = document.getElementById('leader-list');
            if (modal.style.display === "block") { modal.style.display = "none"; return; }
            modal.style.display = "block"; list.innerHTML = "Ładowanie...";
            const { data, error } = await _supabase.from('leaderboard').select('username, score').order('score', { ascending: false }).limit(20);
            if (!error) {
                list.innerHTML = "";
                const uniquePlayers = []; const seenNicks = new Set();
                for (const entry of data) {
                    const cleanNick = entry.username.trim().toLowerCase();
                    if (!seenNicks.has(cleanNick)) { seenNicks.add(cleanNick); uniquePlayers.push(entry); }
                    if (uniquePlayers.length === 5) break;
                }
                uniquePlayers.forEach((p, i) => {
                    list.innerHTML += `<div class="leader-item"><span><span class="rank-number">${i+1}.</span>${p.username}</span><b>$${formatScore(p.score)}</b></div>`;
                });
            } else { list.innerHTML = "Błąd bazy."; }
        }

        document.getElementById('show-leaders').onclick = toggleLeaders;

        let balls = []; let pins = []; let multipliers = [];
        let spacingX = 45; let bottomY = 0;
        const ballRadius = 7, pinRadius = 4, gravity = 0.16, bounceForce = 2.0;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playHitSound(freq = 400) {
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } catch(e){}
        }

        function updateUIState() {
            const isPlaying = balls.length > 0;
            uiSliders.querySelectorAll('.slider-group').forEach(el => {
                isPlaying ? el.classList.add('disabled') : el.classList.remove('disabled');
            });
            updateSliderLimits();
        }

        // --- ZMODYFIKOWANA FUNKCJA USTAWIANIA PLANSZY I MNOŻNIKÓW ---
        function setupBoard() {
            pins = []; multipliers = [];
            const rCount = parseInt(document.getElementById('rowsSlider').value);
            document.getElementById('rowsVal').innerText = rCount;
            const spacingY = Math.min(30, 400 / rCount); 

            // Generowanie pinów
            for (let i = 0; i < rCount; i++) {
                const pinsInRow = i + 3;
                for (let j = 0; j < pinsInRow; j++) {
                    pins.push({x: canvas.width / 2 + (j - (pinsInRow - 1) / 2) * spacingX, y: 50 + i * spacingY});
                }
            }

            // OPCJA B: Stałe mnożniki (symetryczne)
            // Przykład dla 16 rzędów (17 slotów)
            const baseMultipliers = [110, 41, 10, 5, 2, 1.5, 1, 0.5, 0.2, 0.5, 1, 1.5, 2, 5, 10, 41, 110];
            
            const slotsCount = (rCount - 1) + 3 - 1;
            
            // Dopasowujemy tablicę do liczby rzędów (wycinamy środek lub brzegi)
            // Dla prostoty: wybieramy wartości symetrycznie od środka
            const midBase = Math.floor(baseMultipliers.length / 2);
            const midTarget = (slotsCount - 1) / 2;

            for (let i = 0; i < slotsCount; i++) {
                const offset = i - midTarget;
                const baseIdx = midBase + offset;
                // Pobieramy z tablicy lub dajemy 1.0 jeśli poza zakresem
                const val = baseMultipliers[baseIdx] !== undefined ? baseMultipliers[baseIdx] : 1.0;
                multipliers.push(val);
            }

            bottomY = 50 + (rCount - 1) * spacingY;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#475569";
            pins.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, pinRadius, 0, Math.PI*2); ctx.fill(); });
            
            const startX = (canvas.width - multipliers.length * spacingX) / 2;
            const centerIdx = (multipliers.length - 1) / 2;

            multipliers.forEach((m, i) => {
                // NOWE KOLOROWANIE: Żółty w środku -> Czerwony na zewnątrz
                const distFromCenter = Math.abs(i - centerIdx) / centerIdx; // 0 to środek, 1 to krawędź
                const r = 255;
                const g = Math.floor(255 * (1 - distFromCenter)); // G maleje do 0 na brzegach
                const b = Math.floor(100 * (1 - distFromCenter)); // B maleje do 0
                
                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.fillRect(startX + i * spacingX + 2, bottomY + 20, spacingX - 4, 30);
                
                ctx.fillStyle = distFromCenter > 0.6 ? "white" : "#020617"; // Kontrastowy tekst
                ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(m + "x", startX + i * spacingX + spacingX / 2, bottomY + 40);
            });

            balls.forEach((b, index) => {
                b.vy += gravity; b.x += b.vx; b.y += b.vy;
                pins.forEach(p => {
                    const d = Math.hypot(b.x - p.x, b.y - p.y);
                    if (d < ballRadius + pinRadius) {
                        playHitSound(300 + Math.random() * 100);
                        const a = Math.atan2(b.y - p.y, b.x - p.x);
                        b.vx = Math.cos(a) * bounceForce + (Math.random()-0.5)*0.4;
                        b.vy = Math.sin(a) * bounceForce;
                    }
                });
                ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, ballRadius, 0, Math.PI*2); ctx.fill();
                if (b.y > bottomY + 20) {
                    const slot = Math.floor((b.x - startX) / spacingX);
                    if (slot >= 0 && slot < multipliers.length) {
                        const win = Math.floor(b.bet * multipliers[slot]);
                        score += win;
                        if (score < 10) { alert("Zbankrutowałeś! Reset do 1000$"); score = 1000; }
                        scoreEl.innerText = score;
                        localStorage.setItem('plinko_balance', score);
                        if(win > b.bet) saveScoreToCloud(score);
                    }
                    balls.splice(index, 1); updateUIState();
                }
            });
            requestAnimationFrame(draw);
        }

        costSlider.oninput = (e) => costVal.innerText = formatScore(e.target.value);
        document.getElementById('rowsSlider').oninput = setupBoard;

        dropBtn.onclick = (e) => {
            if (!e.isTrusted) return;
            const now = Date.now();
            if (now - lastClickTime < 300) return;
            lastClickTime = now;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const currentBet = parseInt(costSlider.value);
            if (score >= currentBet) {
                score -= currentBet;
                scoreEl.innerText = score;
                localStorage.setItem('plinko_balance', score);
                balls.push({ x: canvas.width/2, y: 10, vx: (Math.random()-0.5), vy: 1, bet: currentBet });
                updateUIState();
            }
        };

        setupBoard(); updateSliderLimits(); draw();
    </script>
</body>
</html>
